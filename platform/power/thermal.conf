# DroidOS thermal bands.
#
# Format: up_to_c  max_cpu_percent  governor
#
# The table starts fully open so normal use is never throttled, then steps down before the SoC
# reaches the range where it would thermally shut down. max_cpu_percent must never rise as the
# temperature climbs; scripts/check-power.py enforces that.

# Up to 45 C: no throttling, the normal governor.
45   100  schedutil

# 46-55 C: warm from sustained load or charging. Trim the top clock, keep the good governor.
55    85  schedutil

# 56-65 C: sustained heavy use. A conservative governor trades peak clocks for stability.
65    65  conservative

# 66-75 C: hot. Serious cap, the phone stays usable instead of stuttering or shutting down.
75    45  powersave

# Above 75 C: protect the hardware and the battery. This band also covers anything hotter.
120   30  powersave
